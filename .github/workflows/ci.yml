# CI — WebCam Guard v4.0 (stdlib-only; tanpa pip install)
#
# Release gate: job GAGAL bila kompilasi, unit/integration test, fuzz,
# atau posture check gagal. Fitur kamera (OpenCV) tidak diuji di CI —
# hardware-dependent, diuji manual di laptop owner (lihat README).
# Instalasi layanan Windows (sc.exe) tidak diuji di CI — prosedur
# terdokumentasi di docs/SLC-INSTALL-DEMO.md.
#
# Keamanan job:
# - permissions: contents: read SAJA (tanpa token berbahaya)
# - TIDAK ada credential rahasia di source
# - artefak runtime (lab_*.jsonl, evidence_pack/, dst.) TIDAK di-commit

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 1) Syntax check seluruh modul
      - name: Kompilasi (py_compile semua modul)
        run: |
          python3 -m compileall -q webcam_guard.py audit_core.py \
            forensics.py netmon.py credcheck.py redsim.py stealth_sim.py \
            lab_status.py mirror_auth.py mirror_stream.py mirror_server.py \
            mirror_viewer.py privacy.py evidence.py posture.py fuzz_lab.py \
            range_registry.py range_controller.py range_agent.py \
            range_scenarios.py range_report.py \
            slc_actions.py slc_control.py slc_server.py slc_endpoint.py \
            slc_mission.py slc_events.py slc_redblue.py slc_twin.py \
            slc_remediation.py slc_ui.py slc_demo.py
          echo "compileall OK"

      # 2) Unit + integration + regresi (discover otomatis)
      - name: Suite test penuh
        run: |
          python3 -m unittest discover -s tests -v

      # 3) Fuzz deterministik (dua seed — harus 0 crash)
      - name: Fuzz lab (seed 42 & 7)
        run: |
          python3 fuzz_lab.py --seed 42
          python3 fuzz_lab.py --seed 7

      # 4) Smoke test CLI tiap modul lab
      - name: Netmon demo + evaluasi detektor
        run: |
          python3 netmon.py --demo
          python3 netmon.py --evaluasi

      - name: Redsim — target in-scope & out-of-scope (exit 2)
        run: |
          python3 redsim.py --target lab-01.local
          python3 redsim.py --target 8.8.8.8 && { echo "HARUSNYA DITOLAK"; exit 1; } || [ $? -eq 2 ]

      - name: Forensics + anchor checkpoint
        run: |
          python3 forensics.py --checkpoint

      - name: Evidence build + verify (read-only)
        run: |
          python3 evidence.py --build --events lab_events.jsonl --audit lab_audit.jsonl
          python3 evidence.py --verify

      - name: Privacy ringkasan (dry-run, tanpa hapus)
        run: |
          python3 privacy.py

      # 4b) Range v3.0 — registry, scenario engine (scope-enforced),
      # laporan before/after. Artefak ditulis ke /tmp (bukan repo).
      - name: Range registry — enroll + list (artefak /tmp)
        run: |
          mkdir -p /tmp/range-ci
          python3 range_registry.py --file /tmp/range-ci/devices.json \
            --audit /tmp/range-ci/audit.jsonl --enroll ci-vm-01 \
            --peran operator | grep -q "ENROLL OK"
          python3 range_registry.py --file /tmp/range-ci/devices.json \
            --audit /tmp/range-ci/audit.jsonl | grep -q "ci-vm-01"

      - name: Range scenarios — fixture loopback (in-scope) vs produksi (ditolak)
        run: |
          python3 range_scenarios.py --scope tests/scope_loopback.json \
            --events /tmp/range-ci/events.jsonl --audit /tmp/range-ci/audit.jsonl \
            | tee /tmp/range-ci/skenario.txt
          grep -q "detection_rate: 1.0" /tmp/range-ci/skenario.txt
          set +e
          python3 range_scenarios.py --scope lab_scope.json \
            --events /tmp/range-ci/events2.jsonl --audit /tmp/range-ci/audit2.jsonl \
            > /tmp/range-ci/skenario2.txt
          KODE=$?
          set -e
          grep -q "DITOLAK_SCOPE" /tmp/range-ci/skenario2.txt
          [ "$KODE" -eq 2 ]

      - name: Range report — before/after (jujur: tanpa klaim angka test)
        run: |
          python3 range_report.py --jalankan-netmon

      # 4c) SLC v4.0 — action registry, mission engine, demo sintetis
      # berlabel, laporan acceptance. Semua artefak ke /tmp (bukan repo).
      - name: SLC action registry — daftar + tolak aksi tak dikenal
        run: |
          mkdir -p /tmp/slc-ci
          python3 slc_actions.py --daftar | grep -q "asesmen_keamanan"
          set +e
          python3 slc_actions.py --jalankan aksi_tidak_ada 2> /tmp/slc-ci/tolak.txt
          KODE_AKSI=$?
          set -e
          grep -q "aksi tidak dikenal" /tmp/slc-ci/tolak.txt
          [ "$KODE_AKSI" -ne 0 ]

      - name: SLC demo mode — perangkat sintetis berlabel
        run: |
          python3 slc_demo.py --demo | grep -q "SINTETIS-DEMO"

      - name: SLC acceptance report — suite penuh harus hijau
        run: |
          python3 slc_demo.py --evaluasi --tulis /tmp/slc-ci/acceptance.md
          grep -q "SEMUA LULUS" /tmp/slc-ci/acceptance.md

      # Catatan jujur: transport TLS nyata (slc_server/slc_endpoint antar-host)
      # dan instalasi layanan Windows SC.exe TIDAK diuji smoke ini — butuh
      # sertifikat + PC Windows fisik; perilakunya diuji oleh
      # tests/test_slc_endpoint.py (loopback; 3 test TLS di-skip tanpa
      # sertifikat) dan prosedur di docs/SLC-INSTALL-DEMO.md.

      # Catatan jujur: range_agent + range_controller butuh pasangan
      # socket hidup (enrollment kunci nyata, out-of-band) — diuji oleh
      # tests/test_range_controller_agent.py (42 test socket loopback),
      # TIDAK oleh smoke CLI ini.

      # 5) Security posture — TIDAK BOLEH ada bloker GAGAL-KRITIS
      - name: Posture engine (gate release)
        run: |
          python3 posture.py

      # Catatan jujur: dependency scan (pip-audit) TIDAK dijalankan di CI
      # ini karena modul inti stdlib-only dan requirements hanya untuk
      # fitur kamera opsional. Jalankan manual:
      #   pip install pip-audit && pip-audit -r requirements.txt
      # posture.py (P-15) akan tetap melaporkannya sebagai NOT RUN.
